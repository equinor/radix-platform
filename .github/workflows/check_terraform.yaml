name: Check Terraform infrastructure
on:
  pull_request:
    paths:
      - terraform/subscriptions/**

permissions:
  id-token: write
  contents: read

jobs:
  terrform:
    name: Check infrastructure consistency
    runs-on: radix-runner
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "dev"
            folderName: "dev"
            subscription: "s941"
          - name: "playground"
            folderName: "playground"
            subscription: "s941"
          - name: "platform"
            folderName: "prod"
            subscription: "s940"
          - name: "c2"
            folderName: "c2"
            subscription: "s940"
    environment: ${{matrix.target.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 'Az login'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 'latest'

      - name: Check Terraform in ${{ matrix.target.name}}
        working-directory: terraform/subscriptions/scripts
        shell: bash
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ matrix.target.subscription}}
          ENVIRONMENT: ${{matrix.target.folderName}}
        run: ./terraform.sh

